name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  index-algolia:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.ALGOLIA_APP_ID != '' }}
    env:
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check Algolia configuration
        id: algolia-config
        env:
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: |
          if [ -n "$ALGOLIA_ADMIN_KEY" ] && [ -n "$ALGOLIA_INDEX_NAME" ] && [ -n "$SITE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          
      - uses: actions/checkout@v4
        if: ${{ steps.algolia-config.outputs.enabled == 'true' }}
  
      - uses: actions/setup-node@v4
        if: ${{ steps.algolia-config.outputs.enabled == 'true' }}
        with:
          node-version: 22
          cache: npm
  
      - name: Install dependencies
        if: ${{ steps.algolia-config.outputs.enabled == 'true' }}
        run: npm ci
  
      - name: Index documentation to Algolia
        if: ${{ steps.algolia-config.outputs.enabled == 'true' }}
        env:
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: npm run index-algolia
