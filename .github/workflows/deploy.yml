name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed-pages: ${{ steps.changed-pages.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the pages changed by this push can be listed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: List changed pages
        id: changed-pages
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          {
            echo "list<<CHANGED_PAGES_EOF"
            node scripts/changed-kb-pages.js "$BEFORE_SHA" "$GITHUB_SHA" || true
            echo "CHANGED_PAGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set custom domain
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "${SITE_URL#https://}" > build/CNAME
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  index-algolia:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.ALGOLIA_APP_ID != '' }}
    env:
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check Algolia configuration
        id: algolia-config
        env:
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: |
          if [ -n "$ALGOLIA_ADMIN_KEY" ] && [ -n "$ALGOLIA_INDEX_NAME" ] && [ -n "$SITE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          
      - uses: actions/checkout@v4
        if: ${{ steps.algolia-config.outputs.enabled == 'true' }}
  
      - uses: actions/setup-node@v4
        if: ${{ steps.algolia-config.outputs.enabled == 'true' }}
        with:
          node-version: 22
          cache: npm
  
      - name: Install dependencies
        if: ${{ steps.algolia-config.outputs.enabled == 'true' }}
        run: npm ci
  
      - name: Index documentation to Algolia
        if: ${{ steps.algolia-config.outputs.enabled == 'true' }}
        env:
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: npm run index-algolia

  notify-slack:
    name: "Notify #wpbakery-support"
    runs-on: ubuntu-latest
    needs: [ build, deploy, index-algolia ]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Push to Slack
        env:
          SLACK_SUPPORT_URL: ${{ secrets.SLACK_SUPPORT_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CHANGED_PAGES: ${{ needs.build.outputs.changed-pages }}
        run: |
          if [ -z "$SLACK_SUPPORT_URL" ]; then
            echo "SLACK_SUPPORT_URL is not set, skipping notification."
            exit 0
          fi

          SITE_LINK="${SITE_URL:-https://kb.wpbakery.com}"
          COMMIT_TITLE=$(printf '%s' "$COMMIT_MESSAGE" | tr -s '\n' ' ' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/|/\//g')
          TEXT="📚 Knowledge Base deployed: <${SITE_LINK}|${SITE_LINK#https://}> updated to the latest version, <https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}|${COMMIT_TITLE:-${GITHUB_SHA:0:7}}>."
          if [ -n "$CHANGED_PAGES" ]; then
            TEXT="${TEXT}"$'\n'"Changed pages:"$'\n'"${CHANGED_PAGES}"
          fi

          jq -n --arg text "$TEXT" '{text: $text}' | curl -X POST -H 'Content-type: application/json' \
            --data @- \
            "$SLACK_SUPPORT_URL"
